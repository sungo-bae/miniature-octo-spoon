name: monthly-archive

# 연구용 월간 보관본: Supabase 표 전체를 CSV(gzip)로 내보내 비공개 저장소의 릴리스로 올린다.
# 매월 2일 03:17 KST에 Supabase pg_cron이 실행시킨다(GitHub 예약 실행은 늦거나 멈출 수 있어서).
# 아래 schedule은 예비로, 3일 03:17 KST에 이번 달 보관본이 아직 없을 때만 만든다.
#
# 필요한 설정 (docs/KEYS.md #11):
#   Secret  ARCHIVE_TOKEN  보관 저장소 하나에만 Contents 읽기·쓰기 권한을 준 fine-grained 토큰
#   Variable ARCHIVE_REPO  보관 저장소 (기본값 sungo-bae/silverjob-data). 공개 저장소에는 올리지 않는다.
on:
  schedule:
    - cron: "17 18 2 * *"
  workflow_dispatch:

concurrency:
  group: monthly-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GH_TOKEN: ${{ secrets.ARCHIVE_TOKEN }}
      ARCHIVE_REPO: ${{ vars.ARCHIVE_REPO || 'sungo-bae/silverjob-data' }}
      TZ: Asia/Seoul
    steps:
      - name: 보관 저장소 확인
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::ARCHIVE_TOKEN이 없습니다. docs/KEYS.md #11을 보고 등록해 주세요."; exit 1
          fi
          if [ "$(gh api "repos/$ARCHIVE_REPO" --jq .private)" != "true" ]; then
            echo "::error::$ARCHIVE_REPO 가 비공개 저장소가 아니거나 열 수 없습니다. 공개 저장소에는 올리지 않습니다."; exit 1
          fi
          echo "TAG=data-$(date +%Y-%m)" >> "$GITHUB_ENV"
          echo "DAY=$(date +%Y-%m-%d)" >> "$GITHUB_ENV"
      - name: 이번 달 보관본이 이미 있으면 예비 실행은 건너뜀
        if: ${{ github.event_name == 'schedule' }}
        run: |
          if gh release view "$TAG" -R "$ARCHIVE_REPO" >/dev/null 2>&1; then
            echo "SKIP=1" >> "$GITHUB_ENV"; echo "$TAG 이미 있음"
          fi
      - uses: actions/checkout@v4
        if: ${{ env.SKIP != '1' }}
      - uses: actions/setup-python@v5
        if: ${{ env.SKIP != '1' }}
        with:
          python-version: "3.12"
      - if: ${{ env.SKIP != '1' }}
        run: pip install -r requirements.txt
      - name: Supabase 표 내보내기
        if: ${{ env.SKIP != '1' }}
        run: python -m pipeline.archive --out archive
      - name: 비공개 저장소 릴리스로 올리기
        if: ${{ env.SKIP != '1' }}
        run: |
          python - <<'PY' > notes.md
          import json
          m = json.load(open("archive/manifest.json", encoding="utf-8"))
          print(f"실버잡 수집 자료 누적 보관본 — {m['exported_at']} (KST) 기준\n")
          print("| 표 | 행 수 | SHA-256 |\n|---|---:|---|")
          for name, t in m["tables"].items():
              print(f"| `{t['file']}` | {t['rows']:,} | `{t['sha256'][:16]}…` |")
          print("\n열 설명은 DATA_DICTIONARY.md, 수집 방법이 바뀐 날짜는 DATA_CHANGELOG.md를 보세요.")
          PY
          # 같은 달에 다시 실행하면(직접 실행) 그달 보관본을 최신 자료로 바꾼다
          if gh release view "$TAG" -R "$ARCHIVE_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" archive/* -R "$ARCHIVE_REPO" --clobber
            gh release edit "$TAG" -R "$ARCHIVE_REPO" --title "실버잡 데이터 $DAY" --notes-file notes.md
          else
            gh release create "$TAG" archive/* -R "$ARCHIVE_REPO" --title "실버잡 데이터 $DAY" --notes-file notes.md
          fi
