name: daily-silverjob

# 매일 06:07 KST: 공고 수집 → 하루치 스냅샷 반영 → 주간 예측 갱신
on:
  schedule:
    - cron: "7 21 * * *"
  workflow_dispatch:

jobs:
  ingest-and-forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Ingest (노인 구인정보)
        run: python -m pipeline.ingest --source kordi
      - name: Ingest (자립형일자리 사업모집)
        if: ${{ !cancelled() }}   # 앞 출처가 실패해도 이 출처는 수집한다
        run: python -m pipeline.ingest --source kordi_jobbsn
      - name: Forecast
        if: ${{ !cancelled() }}
        run: python -m pipeline.forecast

