[build]
  command = "node scripts/generate-job-pages.mjs && node scripts/generate-guides.mjs && node scripts/update-data-summary.mjs"
  publish = "."

# 채용 상세페이지(/jobs/<slug>.html)는 더 이상 빌드 시점에 정적 파일로 미리 만들지
# 않고, 요청이 올 때 job-page 함수가 그 자리에서 렌더링합니다(빌드 크레딧 절약).
# force를 쓰지 않았으므로, 실제 파일이 있는 /jobs/index.html은 이 규칙보다 먼저
# 그대로 서빙됩니다 — Netlify는 매칭되는 정적 파일이 있으면 그걸 우선합니다.
# "/jobs/*.html"처럼 와일드카드 뒤에 글자를 붙이는 패턴은 Netlify에서 매칭이
# 안 되는 것으로 확인되어(배포해보니 리다이렉트 자체가 안 먹히고 기본 404로
# 떨어짐), 뒤에 아무것도 안 붙는 기본 "/jobs/*" 형태로 되돌렸습니다. js/main.js의
# content/*.json 상대경로는 이미 절대경로로 고쳐뒀으므로, 넓게 매칭해도
# /jobs/ 밑으로 엉뚱한 요청이 들어올 일은 없습니다. 쿼리스트링으로 :splat을
# 넘기는 방식은 실제 운영 환경에서 값이 비어 전달돼서, 함수가 요청 경로에서
# 직접 슬러그를 뽑도록 바꿨습니다(쿼리스트링 불필요).
[[redirects]]
  from = "/jobs/*"
  to = "/.netlify/functions/job-page"
  status = 200

# 기본 보안 설정 (모든 정적 페이지). 공고 상세(job-page 함수)는 함수 응답에 같은 값을 직접 넣습니다.
# - nosniff: 파일 종류를 브라우저가 멋대로 추측해 스크립트로 실행하지 못하게
# - 다른 사이트가 실버잡을 몰래 끼워 넣어(iframe) 클릭을 가로채지 못하게 (실버잡 안에서 끼우는 것은 허용)
# - base-uri/object-src: 끼어든 태그가 주소 기준이나 플러그인을 바꾸지 못하게
# 스크립트 출처까지 막는 강한 CSP는 애드센스·카카오·Supabase 등과 충돌할 수 있어 넣지 않았습니다.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000"
    Content-Security-Policy = "frame-ancestors 'self'; base-uri 'self'; object-src 'none'"
